name: nix-ci
on:
  push:
    branches:
      - main
      - "releases/**"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://REMOVED-CACHE-HOST/main
            extra-trusted-public-keys = REMOVED-CACHE-KEY
      # Join the tailnet as an ephemeral tag:ci node so the runner can reach
      # the nix cache service (svc:nix-cache). Ping the service VIP instead
      # of its DNS name: GitHub runners keep systemd-resolved as their DNS
      # stub, so MagicDNS names don't resolve here.
      - uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          ping: REMOVED-CACHE-VIP
      # Pin the service's DNS name to its TailVIP in /etc/hosts: the VIP is
      # stable per service, and TLS stays valid because clients use the
      # hostname through SNI.
      - name: Pin tailnet service DNS
        run: echo "REMOVED-CACHE-VIP REMOVED-CACHE-HOST" | sudo tee -a /etc/hosts
      - run: nix build --print-build-logs
      - name: Push to Cache
        if: github.ref == 'refs/heads/main'
        run: |
          nix run github:zhaofengli/attic -- login ci https://REMOVED-CACHE-HOST ${{ secrets.ATTIC_TOKEN }}
          nix run github:zhaofengli/attic -- push main ./result
