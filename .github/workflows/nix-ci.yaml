name: nix-ci
on:
  push:
    branches:
      - main
      - "releases/**"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://REMOVED-CACHE-HOST/main
            extra-trusted-public-keys = REMOVED-CACHE-KEY
      # Join the tailnet as an ephemeral tag:ci node so the runner can reach
      # the nix cache service (svc:nix-cache). `ping` blocks until the
      # service is actually reachable — tailnet propagation is eventually
      # consistent and nix would otherwise fail DNS resolution.
      - uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          use-ephemeral: true
          ping: REMOVED-CACHE-HOST
      - run: nix build --print-build-logs
      - name: Push to Cache
        if: github.ref == 'refs/heads/main'
        run: |
          nix run github:zhaofengli/attic -- login ci https://REMOVED-CACHE-HOST ${{ secrets.ATTIC_TOKEN }}
          nix run github:zhaofengli/attic -- push main ./result
